apiVersion: batch/v1
kind: Job
metadata:
  name: lsst-renew-voms-proxy-on-install   
  annotations:
    argocd.argoproj.io/sync-wave: 1

spec:
  template:
    spec:
      serviceAccountName: lsst-voms-proxy-writer
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: harbor-tier1-test
      containers:
        - name: renew-voms-init
          image: harbor.stfc.ac.uk/ral-tier1_public/lsst/voms-proxy-renewal:test-2025-02-18.1
          imagePullPolicy: Always
          volumeMounts:
                - mountPath: /etc/certs/
                  name: voms-long-proxy
      volumes:
            - configMap:
                name: lsst-voms-config
              name: lsst-voms-config
            - name: voms-long-proxy
              secret:
                secretName: long-proxy
