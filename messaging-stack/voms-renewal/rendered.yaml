# Source: my-voms-renewal-chart/templates/renew-voms-cron.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lsst-renew-voms-proxy
  namespace: lsst-drp-kafka
  annotations:
    argocd.argoproj.io/sync-wave: 1
spec:
  schedule: 42 */6 * * *
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 43200
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: lsst-voms-proxy-writer
          imagePullSecrets:
            - name: harbor-tier1-test
          restartPolicy: OnFailure
          containers:
            - name: renew-voms-cron
              image: harbor.stfc.ac.uk/ral-tier1_public/lsst/voms-proxy-renewal:test-2025-02-18.1
              imagePullPolicy: Always
              volumeMounts:
                - mountPath: /etc/certs/
                  name: voms-long-proxy
          volumes:
            - configMap:
                name: lsst-voms-config
              name: lsst-voms-config
            - name: voms-long-proxy
              secret:
                secretName: long-proxy
