namespace: lsst-drp-kafka

vomsRenewal:
  cron: 
    argoSyncWave: "1"
    schedule: "42 */6 * * *"
    restartPolicy: OnFailure
    serviceAccountName: lsst-voms-proxy-writer
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    ttlSecondsAfterFinished: 43200 # 12 hours

  installJob:
    command:
      - /bin/bash
      - -c
      - |
        echo "Starting debug mode..."
        sleep infinity
    argoSyncWave: "1"
    restartPolicy: OnFailure
    serviceAccountName: lsst-voms-proxy-writer

  image:
    repository: "harbor.stfc.ac.uk/ral-tier1_public/lsst/voms-proxy-renewal"
    tag: test-2025-02-18.1
    pullPolicy: Always
    imagePullSecrets: harbor-lsst-prod

  volumes:
    - name: lsst-voms-config
      configMap:
        name: lsst-voms-config
    - name: voms-long-proxy
      secret:
        secretName: long-proxy

  secretMounts:
    - name: voms-long-proxy
      mountPath: /etc/certs/

  proxyWriterAccount:
    namespace: lsst-drp-kafka
    argoSyncWave: "0"

  proxyWriterRole:
    argoSyncWave: "0"
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "create", "update", "patch"]

  proxyWriterBinding:
    argoSyncWave: "0"
    subjects:
      - kind: ServiceAccount
        name: lsst-voms-proxy-writer
        namespace: lsst-drp-kafka
    roleRef:
      kind: Role
      name: lsst-secret-writer-role
      apiGroup: rbac.authorization.k8s.io