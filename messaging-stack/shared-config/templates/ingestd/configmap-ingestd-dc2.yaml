apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestd-dc2-config
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.configMaps.argoSyncWave }}"
data:
  ingestD.yaml: |
    brokers:
      - my-cluster-kafka-bootstrap:9092
    group_id: "ral_ingestd"
    num_messages: 50
    butler_repo: panda-test-med-1
    topics:
      RAL_BUTLER_DISK-dc2:
        rucio_prefix: davs://webdav.echo.stfc.ac.uk:1094/lsst:datadisk/butler/repos/panda-test-med-1/