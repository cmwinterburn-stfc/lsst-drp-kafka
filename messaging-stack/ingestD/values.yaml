vomsRenewal:

  schedule: "42 */6 * * *"
  restartPolicy: OnFailure
  serviceAccountName: lsst-voms-proxy-writer

  image:
    repository: "harbor.stfc.ac.uk/ral-tier1_public/lsst/voms-proxy-renewal"
    tag: test-2025-02-18.1
    pullPolicy: Always
    imagePullSecrets: harbor-tier1-test

  volumes:
    - name: lsst-voms-config
      configMap:
        name: lsst-voms-config
    - name: voms-long-proxy
      secret:
        secretName: long-proxy

  secretMounts:
    - name: voms-long-proxy
      mountPath: /etc/certs/

