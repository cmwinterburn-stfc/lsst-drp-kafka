apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestd-hsc-pdr2-multisite-config
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.configMaps.argoSyncWave }}
data:
  ingestD.yaml: |
    brokers:
      - my-cluster-kafka-bootstrap:9092
    group_id: "ral_ingestd"
    num_messages: 50
    butler_repo: hsc_pdr2_multisite
    topics:
      RAL_BUTLER_DISK-hsc_pdr2_multisite:
        rucio_prefix: davs://webdav.echo.stfc.ac.uk:1094/lsst:datadisk/butler/repos/hsc_pdr2_multisite/
  