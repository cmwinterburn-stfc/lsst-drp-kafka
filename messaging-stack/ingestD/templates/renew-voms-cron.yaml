apiVersion: batch/v1
kind: CronJob
metadata:
  name: lsst-renew-voms-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "{{ .Values.vomsRenewal.schedule }}"
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.vomsRenewal.backoffLimit | default 1 }}
      template:
        spec:
          serviceAccountName: {{ .Values.vomsRenewal.serviceAccountName" }}
          imagePullSecrets:
            - name: {{ .Values.vomsRenewal.image.imagePullSecrets }}
          restartPolicy: {{ .Values.vomsRenewal.restartPolicy }}
          containers:
            - name: renew-voms-cron
              image: "{{ .Values.vomsRenewal.image.repository }}:{{ .Values.vomsRenewal.image.tag }}"
              imagePullPolicy: "{{ .Values.vomsRenewal.image.pullPolicy }}"
              volumeMounts:
{{ .Values.vomsRenewal.secretMounts | toYaml | indent 16 }}
          volumes:
{{ .Values.vomsRenewal.volumes | toYaml | indent 16 }}

---

apiVersion: batch/v1
kind: Job
metadata:
  name: lsst-renew-voms-proxy-on-install   
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: renew-voms-init
          image: "{{ .Values.vomsRenewal.image.repository }}:{{ .Values.vomsRenewal.image.tag }}"
          imagePullPolicy: "{{ .Values.vomsRenewal.image.pullPolicy }}"
          volumeMounts:
{{ .Values.vomsRenewal.secretMounts | toYaml | indent 16 }}
      volumes:
{{ .Values.vomsRenewal.volumes | toYaml | indent 16 }}
