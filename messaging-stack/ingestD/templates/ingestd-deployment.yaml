apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestd
  namespace: lsst-drp-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestd
  template:
    metadata:
      labels:
        app: ingestd
    spec:
      imagePullSecrets: 
        - name: harbor-tier1-test

      # ----------------------------------------------------
      # INIT CONTAINER: prepares db-auth.yaml with correct perms
      # ----------------------------------------------------
      initContainers:
        - name: prepare-dbauth
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Preparing Butler DB auth file..."
              cp /secret-src/db-auth.yaml /work/db-auth.yaml
              chown lsst:lsst /work/db-auth.yaml
              chmod 600 /work/db-auth.yaml
              ls -l /work/db-auth.yaml
              echo "Done."
          volumeMounts:
            - name: butler-secret
              mountPath: /secret-src    # Secret appears here
              readOnly: true
            - name: dbauth-work
              mountPath: /work          # Writable destination

      containers:
        - name: ingestd
          image: harbor.stfc.ac.uk/ral-tier1_public/lsst/ingestd/ingestd:2026-02-26.debug2
          imagePullPolicy: Always

          # DO NOT RUN AS ROOT
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          # -----------------------------
          # Environment
          # -----------------------------
          env:
            - name: CTRL_INGESTD_CONFIG
              value: /etc/ingestd-configs/ingestD.yaml

            # IMPORTANT — this now points to the FILE CREATED BY INITCONTAINER
            - name: LSST_DB_AUTH
              value: /work/db-auth.yaml

            - name: DAF_BUTLER_REPOSITORY_INDEX
              value: /etc/butler-repos-index.yaml

            - name: LSST_HTTP_CACERT_BUNDLE
              value: /etc/grid-security/certificates/

            - name: LSST_HTTP_AUTH_CLIENT_KEY
              value: /tmp/x509up_u99

            - name: LSST_HTTP_AUTH_CLIENT_CERT
              value: /tmp/x509up_u99

            - name: LSST_RESOURCES_WEBDAV_CONFIG
              value: /etc/webdav.config

          # -----------------------------
          # Volume Mounts
          # -----------------------------
          volumeMounts:
            - name: shortproxy-lsst
              mountPath: /tmp/x509up_u99
              subPath: x509up_u99
              readOnly: true

            - name: grid-certs
              mountPath: /etc/grid-security/certificates
              readOnly: true

            - name: ingestd-config
              mountPath: /etc/ingestd-configs/ingestD.yaml
              subPath: ingestD.yaml
              readOnly: true

            - name: butler-repos-index
              mountPath: /etc/butler-repos-index.yaml
              subPath: butler-repos-index.yaml
              readOnly: true

            - name: butler-config
              mountPath: /etc/butler.yaml
              subPath: butler.yaml
              readOnly: true

            - name: webdav-config
              mountPath: /etc/webdav.config
              subPath: webdav.config
              readOnly: true

            # Mount shared prepared db-auth.yaml
            - name: dbauth-work
              mountPath: /work

      # -----------------------------
      # Volumes
      # -----------------------------
      volumes:

        - name: shortproxy-lsst
          secret:
            secretName: shortproxy-lsst

        # SECRET — raw read-only db-auth.yaml
        - name: butler-secret
          secret:
            secretName: butler-access
            defaultMode: 0600   # Required by DbAuth

        # Writable place where initContainer places prepared file
        - name: dbauth-work
          emptyDir: {}          # Lives for life of pod

        - name: grid-certs
          configMap:
            name: grid-certs

        - name: ingestd-config
          configMap:
            name: ingestd-config

        - name: butler-repos-index
          configMap:
            name: butler-repos-index

        - name: butler-config
          configMap:
            name: butler-config

        - name: webdav-config
          configMap:
            name: webdav-config