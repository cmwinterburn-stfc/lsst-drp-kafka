apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestd
  namespace: lsst-drp-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.ingestd.argoSyncWave }}"

spec:
  replicas: {{ .Values.ingestd.spec.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.ingestd.spec.selector.matchLabels.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.ingestd.spec.template.metadata.labels.app }}

    spec:
      imagePullSecrets: 
{{ .Values.ingestd.spec.template.spec.imagePullSecrets | toYaml | indent 8 }}

      initContainers:
        - name: {{ .Values.ingestd.initContainer.name }}
          image: {{ .Values.ingestd.initContainer.image }}  
          command:
            - sh
            - -c
            - |
              echo "Preparing Butler DB auth file..."
              cp /secret-src/db-auth.yaml /work/db-auth.yaml
              chown 1000:1000 /work/db-auth.yaml
              chmod 600 /work/db-auth.yaml
              ls -l /work/db-auth.yaml
              echo "Done."
          volumeMounts: 
{{ .Values.initContainer.volumeMounts | toYaml | indent 12 }}

      containers:
        - name: {{ .Values.ingestd.container.name }}
          image: {{ .Values.ingestd.container.image }}
          imagePullPolicy: {{ .Values.ingestd.container.imagePullPolicy }}
          securityContext:
            runAsUser: {{ .Values.ingestd.container.securityContext.runAsUser }}
            runAsGroup: {{ .Values.ingestd.container.securityContext.runAsGroup }}
          env:
{{ toYaml .Values.ingestd.container.env | indent 12 }}
          volumeMounts:
{{toYaml .Values.ingestd.container.volumeMounts | indent 12 }}

      volumes:
{{- range $name, $vol := .Values.ingestd.volumes }}
        - name: {{ $name }}
{{ toYaml $vol | nindent 10 }}
{{- end }}
