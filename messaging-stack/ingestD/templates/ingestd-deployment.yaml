apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingestd.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.ingestd.argoSyncWave }}"

spec:
  replicas: {{ .Values.ingestd.spec.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.ingestd.spec.selector.matchLabels.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.ingestd.spec.template.metadata.labels.app }}

    spec:
    #Initialise the init container to prepare the Butler DB auth file with correct permissions before the main container starts
      initContainers:
        - name: {{ .Values.ingestd.initContainer.name }}
          image: {{ .Values.ingestd.initContainer.image }}  
          command:
            - sh
            - -c
            - |
              #!/bin/sh
              set -eu
              log() {
                echo "$(date -Is) [db-auth] $*"
              }
              log "Preparing Butler DB auth file"
              if [ ! -f /secret-src/db-auth.yaml ]; then
                log "ERROR: source db-auth not found"
                exit 1
              fi
              cp /secret-src/db-auth.yaml /work/db-auth.tmp
              chown 1000:1000 /work/db-auth.tmp
              chmod 600 /work/db-auth.tmp
              mv /work/db-auth.tmp /work/db-auth.yaml
              log "Butler DB auth file prepared successfully"

          volumeMounts: 
{{ .Values.ingestd.initContainer.volumeMounts | toYaml | indent 12 }}

      containers:
      
      - name: {{ .Values.ingestd.container.name }}
        image: {{ .Values.ingestd.container.image }}
        imagePullPolicy: {{ .Values.ingestd.container.imagePullPolicy }}
        securityContext:
          runAsUser: {{ .Values.ingestd.container.securityContext.runAsUser }}
          runAsGroup: {{ .Values.ingestd.container.securityContext.runAsGroup }}
        env:
{{ toYaml .Values.ingestd.container.env | indent 12 }}
        volumeMounts:
{{toYaml .Values.ingestd.container.volumeMounts | indent 12 }}
        # Use a startup probe to wait for the DB auth file to be ready before starting the main container
        startupProbe:
          exec:
            command:
              - sh
              - -c
              - test -f /work/db-auth.yaml
          failureThreshold: 60
          periodSeconds: 1

      - name: {{ .Values.ingestd.sidecarContainer.name }}
        image: {{ .Values.ingestd.sidecarContainer.image }}
        command:
          - sh
          - -c
          - |
            #!/bin/sh
            set -eu
            log() {
              echo "$(date -Is) [proxy-sync] $*"
            }
            log "Starting proxy sync loop"
            while true; do
              if [ ! -f /proxy-src/proxy ]; then
                log "ERROR: source proxy not found"
                exit 1
              fi
              cp /proxy-src/proxy /work/x509up.tmp
              chown 1000:1000 /work/x509up.tmp
              chmod 600 /work/x509up.tmp
              mv /work/x509up.tmp /work/x509up
              log "Proxy synced successfully"
              sleep 21600 # Sleep for 6 hours before next sync
            done
        volumeMounts: 
{{ .Values.ingestd.sidecarContainer.volumeMounts | toYaml | indent 12 }}

      volumes:
{{- range $name, $vol := .Values.ingestd.volumes }}
        - name: {{ $name }}
{{ toYaml $vol | nindent 10 }}
{{- end }}
