# Kafka Bridge resource definition for Strimzi. 
# This configuration defines the Kafka Bridge component of the Strimzi Kafka cluster, 
# providing a REST API for producing and consuming messages to and from Kafka topics.
apiVersion: kafka.strimzi.io/v1
kind: KafkaBridge
metadata:
  name: {{ .Values.bridge.metadata.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.bridge.spec.replicas }}
  bootstrapServers: {{ .Values.bridge.spec.bootstrapServers }}
  http:
    port: {{ .Values.bridge.spec.port }}
  metricsConfig:
    type: {{ .Values.bridge.metricsConfig.type }}