apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-bridge-pods
  namespace: lsst-drp-kafka
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      strimzi.io/name: my-bridge-bridge
  podMetricsEndpoints:
  - port: rest-api
    path: /metrics
    interval: 10s
