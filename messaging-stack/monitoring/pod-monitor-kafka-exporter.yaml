# PodMonitor resource to monitor Kafka Exporter pods using Prometheus. 
# This configuration allows Prometheus to scrape metrics from the Kafka Exporter application.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: lsst-drp-kafka
  labels:
    release: rancher-monitoring
spec:
  selector:
    matchLabels:
      strimzi.io/name: my-cluster-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 120s
      scrapeTimeout: 60s
