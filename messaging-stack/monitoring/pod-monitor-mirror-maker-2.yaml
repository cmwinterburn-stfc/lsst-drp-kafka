# PodMonitor resource to monitor Kafka Mirror Maker 2 pods using Prometheus. 
# This configuration allows Prometheus to scrape metrics from the Kafka Mirror Maker 2 application.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mirrormaker-pods
  namespace: lsst-drp-kafka
  labels:
    release: rancher-monitoring
spec:
  selector:
    matchLabels:
      strimzi.io/name: my-mirror-maker-2-mirrormaker2
  podMetricsEndpoints:
  - port: tcp-prometheus
    path: /metrics
    interval: 10s
